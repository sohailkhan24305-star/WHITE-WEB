
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White Web - AI Search</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f7f8fa;
  color:#202124;
  min-height:100vh;
}
header{
  height:70px;background:white;
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 7%;border-bottom:1px solid #eee;
}
.logo{font-size:25px;font-weight:800;letter-spacing:-1px}
.logo span{color:#4778ed}
nav a{
  color:#444;text-decoration:none;
  margin-left:22px;font-size:14px;
}
main{
  max-width:850px;margin:100px auto 50px;
  padding:20px;text-align:center;
}
h1{font-size:45px;letter-spacing:-2px}
.subtitle{color:#777;margin:15px 0 35px;font-size:16px}
.search-box{
  background:white;border:1px solid #e5e7eb;
  border-radius:18px;padding:15px;
  box-shadow:0 8px 35px #0000000a;
}
textarea{
  width:100%;height:100px;border:0;outline:0;
  resize:vertical;font-size:16px;
  font-family:inherit;padding:10px;
}
.actions{
  display:flex;align-items:center;
  justify-content:space-between;gap:10px;
  flex-wrap:wrap;
}
button,.upload{
  border:0;border-radius:10px;
  padding:12px 18px;font-size:14px;
  cursor:pointer;
}
.primary{background:#4778ed;color:white}
.secondary,.upload{background:#f1f3f7;color:#333}
button:hover,.upload:hover{opacity:.85}
#fileInput{display:none}
#fileName{font-size:12px;color:#777;margin-top:10px}
#result{
  display:none;text-align:left;background:white;
  border:1px solid #eee;border-radius:15px;
  padding:22px;margin-top:25px;
  line-height:1.7;white-space:pre-wrap;
}
.suggestions{
  display:flex;justify-content:center;
  gap:12px;flex-wrap:wrap;margin-top:25px;
}
.suggestions button{
  background:white;border:1px solid #e7e9ee;
  color:#555;
}
footer{margin-top:90px;color:#999;font-size:12px}
@media(max-width:600px){
  header{padding:0 18px}
  nav a{margin-left:10px;font-size:12px}
  main{margin-top:65px}
  h1{font-size:35px}
}
</style>
</head>
<body>

<header>
  <div class="logo">WHITE<span>WEB</span></div>
  <nav>
    <a href="#">Home</a>
    <a href="#about">About</a>
  </nav>
</header>

<main>
  <h1>Search Beyond Limits.</h1>
  <p class="subtitle">
    Welcome to White Web — your smart digital workspace.
  </p>

  <div class="search-box">
    <textarea id="question"
      placeholder="Ask anything..."></textarea>

    <div class="actions">
      <div>
        <label class="upload" for="fileInput">＋ Upload file</label>
        <input id="fileInput" type="file"
          accept="image/*,.pdf,.txt,.doc,.docx">
        <button class="secondary" onclick="startVoice()">🎙 Voice</button>
      </div>
      <button class="primary" onclick="sendQuestion()">Search ↗</button>
    </div>
    <div id="fileName"></div>
  </div>

  <div id="result"></div>

  <div class="suggestions">
    <button onclick="ask('Explain artificial intelligence')">AI explained</button>
    <button onclick="ask('Tell me about space')">Explore space</button>
    <button onclick="ask('Help me learn coding')">Learn coding</button>
  </div>

  <footer id="about">
    White Web 2.0 · Simple. Smart. Modern.
  </footer>
</main>

<script>
const question = document.getElementById("question");
const result = document.getElementById("result");
const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");

function ask(text){
  question.value = text;
  sendQuestion();
}

function sendQuestion(){
  const text = question.value.trim();

  if(!text){
    alert("Please type your question first.");
    return;
  }

  result.style.display = "block";
  result.textContent =
    "Your question: " + text +
    "\n\nWhite Web is ready for its AI connection. " +
    "This is currently a frontend demo. " +
    "Connect a secure AI backend to receive real AI answers.";
}

fileInput.addEventListener("change",function(){
  if(this.files.length){
    fileName.textContent =
      "Selected file: " + this.files[0].name;
  }else{
    fileName.textContent = "";
  }
});

function startVoice(){
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Voice input is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.onresult = function(event){
    question.value =
      event.results[0][0].transcript;
  };
  recognition.onerror = function(){
    alert("Voice input failed. Please try again.");
  };
  recognition.start();
}
</script>

</body>
</html>
